baseURL = "https://shouchenstar-github-io.pages.dev/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "Shouchenstar"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
summaryLength = 80

[pagination]
  pagerSize = 10

# 让首页生成 JSON，供站内搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "个人博客 —— 学习笔记、项目实践与日常思考"
  author = "Shouchenstar"
  hideAuthor = true              # 文章元信息行不显示作者名（仍保留在 RSS / SEO 中）
  defaultTheme = "auto"          # auto / light / dark
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true                 # 文章右侧自动生成目录
  TocOpen = false
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  disableScrollToTop = false
  mainSections = ["posts"]       # 首页只列出文章区的页面

  # 左上角显示的文字（只改显示，不改站点标题）
  [params.label]
    text = "首页"

  [params.homeInfoParams]
    Title = "Hello！"
    Content = """
    你好，我是一名集成电路专业学生，本博客会分享一些我觉得有意思的东西。
"""

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 1
    limit = 10
    keys = ["title", "permalink", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Shouchenstar"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[[menus.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menus.main]]
  identifier = "photography"
  name = "摄影"
  url = "/photography/"
  weight = 15

[[menus.main]]
  identifier = "design"
  name = "UI 设计"
  url = "/design/"
  weight = 16

[[menus.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 20

[[menus.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30
